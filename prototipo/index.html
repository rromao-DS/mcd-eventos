<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>MCD Eventos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Conceito: painel azul-petróleo institucional + operação clara em cartões brancos; cada módulo tem cor própria (azul = Funcionários do Evento, roxo = Intermitentes). Cores e fonte PROVISÓRIAS, aproximadas da captura do Portal MCD Normas. */
:root{
  --primary:#1C7D9D; --primary-dark:#146C88; --accent:#F4C225; --accent-ink:#5c4500;
  --bg:#F2F2F2; --surface:#FFFFFF; --surface-2:#F7F9FA; --text:#404950; --muted:#647681; --border:#D7E0E5;
  --success:#2F8C67; --success-bg:#E4F3EC; --warning:#8F6508; --warning-bg:#FBF1D6; --danger:#BB4C49; --danger-bg:#F9E6E5;
  --info-bg:#E2F1F6; --int:#7A4FA0; --int-bg:#EFE8F6; --shadow:0 10px 30px rgb(16 50 66 / 7%);
  --panel:#1C7D9D; --panel-text:#fff; --ink-strong:#22313a;
  --r-card:20px; --r-input:14px;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11191d; --surface:#1a252b; --surface-2:#202d34; --text:#d9e2e7; --muted:#93a6b0; --border:#31424b;
    --success:#5ac49a; --success-bg:#17352a; --warning:#e8bf5a; --warning-bg:#3a2f12; --danger:#e58582; --danger-bg:#3d2020;
    --info-bg:#173642; --int:#b58ddb; --int-bg:#2a2038; --shadow:0 10px 30px rgb(0 0 0 / 30%); --primary:#2a9bc0; --primary-dark:#1C7D9D; --ink-strong:#f1f6f8; --accent-ink:#F4C225;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11191d; --surface:#1a252b; --surface-2:#202d34; --text:#d9e2e7; --muted:#93a6b0; --border:#31424b;
  --success:#5ac49a; --success-bg:#17352a; --warning:#e8bf5a; --warning-bg:#3a2f12; --danger:#e58582; --danger-bg:#3d2020;
  --info-bg:#173642; --int:#b58ddb; --int-bg:#2a2038; --shadow:0 10px 30px rgb(0 0 0 / 30%); --primary:#2a9bc0; --primary-dark:#1C7D9D; --ink-strong:#f1f6f8; --accent-ink:#F4C225;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{color:var(--ink-strong);margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:28px;font-weight:600} h2{font-size:22px;font-weight:600} h3{font-size:17px;font-weight:600} h4{font-size:15px;font-weight:600}
p{margin:0}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--primary)}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap} .between{justify-content:space-between} .grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}
/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;color:var(--text);white-space:nowrap}
.btn:hover{border-color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-dark)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#3d2f00}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.int{background:var(--int);border-color:var(--int);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input[type=text],input[type=password],input[type=search],select,textarea{width:100%;min-height:46px;padding:10px 14px;border:1px solid var(--border);border-radius:var(--r-input);background:var(--surface);}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--primary);outline:2px solid color-mix(in srgb,var(--primary) 35%,transparent)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
/* cartões */
.card{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow);border:1px solid var(--border);padding:20px}
.card.flat{box-shadow:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted);border:1px solid var(--border);white-space:nowrap}
.chip.ok{background:var(--success-bg);color:var(--success);border-color:transparent}
.chip.warn{background:var(--warning-bg);color:var(--warning);border-color:transparent}
.chip.bad{background:var(--danger-bg);color:var(--danger);border-color:transparent}
.chip.info{background:var(--info-bg);color:var(--primary);border-color:transparent}
.chip.int{background:var(--int-bg);color:var(--int);border-color:transparent}
.chip.fe{background:var(--info-bg);color:var(--primary);border-color:transparent}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
/* topo */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--border);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar .in{max-width:1320px;margin:0 auto;min-height:64px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:0;padding:0}
.brand b{font-size:18px;font-weight:700;color:var(--ink-strong)}
.pill-offline{background:var(--danger-bg);color:var(--danger);padding:4px 12px;border-radius:999px;font-weight:700;font-size:12px}
.page{max-width:1320px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-left,0px)) 56px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--muted);align-items:center;margin-bottom:14px}
.crumbs button{background:none;border:0;padding:2px 4px;color:var(--primary);cursor:pointer;font-weight:600;border-radius:6px}
.crumbs span.sep{opacity:.6}
.crumbs .cur{font-weight:600;color:var(--text)}
/* faixa do grupo */
.groupbar{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:14px;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:16px}
.groupbar.fe{background:var(--info-bg);color:var(--primary);border-left:6px solid var(--primary)}
.groupbar.int{background:var(--int-bg);color:var(--int);border-left:6px solid var(--int)}
/* login */
.login{min-height:100vh;display:grid;grid-template-columns:57fr 43fr}
.login .left{background:var(--panel);color:#fff;padding:56px 7vw;position:relative;overflow:hidden;border-radius:0 40px 40px 0;display:flex;flex-direction:column;justify-content:center;gap:20px}
.login .left::before,.login .left::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.07)}
.login .left::before{width:360px;height:360px;right:-120px;top:-120px}
.login .left::after{width:520px;height:520px;left:34%;bottom:-300px}
.login .left h1{color:#fff;font-size:clamp(30px,3.6vw,46px);font-weight:600}
.login .left .eyebrow{color:var(--accent)}
.login .left p{color:rgba(255,255,255,.85);max-width:520px}
.login .right{display:flex;align-items:center;justify-content:center;padding:32px max(16px,env(safe-area-inset-left,0px))}
.login .box{width:100%;max-width:440px;background:var(--surface);border-radius:30px;box-shadow:var(--shadow);padding:36px;display:flex;flex-direction:column;gap:16px;border:1px solid var(--border)}
.benefit{display:flex;gap:12px;align-items:flex-start;position:relative;z-index:1}
.benefit .ck{flex:none;width:34px;height:34px;border-radius:50%;background:var(--accent);color:#3d2f00;display:grid;place-items:center;font-weight:700}
@media (max-width:900px){.login{grid-template-columns:1fr}.login .left{border-radius:0 0 32px 32px;padding:32px 24px}}
/* calendário */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{font-size:12px;font-weight:700;color:var(--muted);text-align:center;padding:6px 0;text-transform:uppercase;letter-spacing:.08em}
.cal .day{position:relative;min-height:72px;border-radius:14px;border:1px solid var(--border);background:var(--surface);padding:8px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between}
.cal .day.off{background:var(--surface-2);opacity:.5;cursor:default}
.cal .day.has{border-color:var(--primary);background:var(--info-bg)}
.cal .day.arch{border-style:dashed;border-color:var(--muted);background:var(--surface-2)}
.cal .day.today{outline:2px solid var(--accent)}
.cal .day b{font-size:15px;color:var(--ink-strong)}
.badge{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:12px;background:var(--primary);color:#fff;font-size:12px;font-weight:700;padding:0 6px}
.badge.arch{background:var(--muted)}
/* eventos */
.evcard{overflow:hidden;padding:0;cursor:pointer;display:flex;flex-direction:column;text-align:left;border:1px solid var(--border);border-radius:var(--r-card);background:var(--surface);box-shadow:var(--shadow)}
.banner{height:130px;position:relative;display:flex;align-items:flex-end;padding:14px 18px;color:#fff;font-weight:700;letter-spacing:.12em;font-size:13px;overflow:hidden}
.banner::before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.12);right:-70px;top:-110px}
.banner.big{height:160px}
.evhead{display:grid;grid-template-columns:auto 1fr;gap:0;overflow:hidden;padding:0}
.module{border-radius:var(--r-card);padding:26px;display:flex;flex-direction:column;gap:14px;text-align:left;border:2px solid;background:var(--surface);cursor:pointer;box-shadow:var(--shadow)}
.module.fe{border-color:var(--primary)} .module.int{border-color:var(--int)}
.module .big{font-size:26px;font-weight:700;color:var(--ink-strong)}
.module .icon{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:26px}
.module.fe .icon{background:var(--info-bg)} .module.int .icon{background:var(--int-bg)}
.module[disabled]{opacity:.5;cursor:not-allowed}
/* módulo */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;align-items:start}
.side{position:sticky;top:84px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:10px;display:flex;flex-direction:column;gap:4px}
.side button{display:flex;align-items:center;gap:10px;min-height:46px;border:0;background:none;border-radius:12px;padding:0 12px;cursor:pointer;font-weight:600;text-align:left;color:var(--text)}
.side button:hover{background:var(--surface-2)}
.side button.on{background:var(--info-bg);color:var(--primary);box-shadow:inset 4px 0 0 var(--accent)}
.shell:has(.side.int) .eyebrow{color:var(--int)}
.side.int button.on{background:var(--int-bg);color:var(--int)}
.side hr{border:0;border-top:1px solid var(--border);margin:6px 0;width:100%}
@media (max-width:1199px){
  .shell{grid-template-columns:1fr}
  .side{position:static;flex-direction:row;overflow-x:auto;padding:8px}
  .side button{white-space:nowrap}.side hr{display:none}
}
.kpi{display:flex;flex-direction:column;gap:2px;padding:16px 18px;border-radius:16px;background:var(--surface);border:1px solid var(--border)}
.kpi b{font-size:28px;color:var(--ink-strong);font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:13px;color:var(--muted)}
.areacard{text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:18px;padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.areacard:hover{border-color:var(--primary)}
.areacard b.t{font-size:17px;color:var(--ink-strong);letter-spacing:.02em}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--border)}
.bar i{display:block;height:100%;background:var(--success)}
/* tabelas */
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:16px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{position:sticky;top:0;text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:12px 14px;background:var(--surface-2);border-bottom:1px solid var(--border);white-space:nowrap}
td{white-space:nowrap;padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
.mono{font-variant-numeric:tabular-nums;font-weight:600}
.pp{display:inline-flex;gap:3px;vertical-align:middle;margin-right:6px}
.pp i{width:16px;height:8px;border-radius:4px;background:var(--border)} .pp i.on{background:var(--success)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.filters label.f{min-width:150px;flex:1}
.pager{display:flex;gap:10px;align-items:center;justify-content:flex-end;padding-top:10px;font-size:13px}
.avatar{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:28px;font-weight:700;color:#fff;flex:none}
.notice{border-radius:14px;padding:12px 16px;font-size:14px;border:1px solid var(--border);background:var(--surface-2)}
.notice.warn{background:var(--warning-bg);color:var(--warning);border-color:transparent}
.notice.bad{background:var(--danger-bg);color:var(--danger);border-color:transparent}
.notice.ok{background:var(--success-bg);color:var(--success);border-color:transparent}
.notice.info{background:var(--info-bg);color:var(--primary);border-color:transparent}
.empty{text-align:center;padding:36px 16px;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.check{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--border)}
.check:last-child{border-bottom:0}
.ci{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px}
.ci.ok{background:var(--success-bg);color:var(--success)} .ci.no{background:var(--danger-bg);color:var(--danger)} .ci.wait{background:var(--warning-bg);color:var(--warning)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--primary);display:inline-block;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
/* modais */
.overlay{position:fixed;inset:0;background:rgba(20,32,38,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--surface);border-radius:22px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.dlg.wide{max-width:760px}
.viewer{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.viewer .vh{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap}
.viewer .vb{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:0}
@media (max-width:1000px){.viewer .vb{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}}
.pdfwrap{overflow:auto;padding:20px;background:#8a98a0;min-height:0}
.pdfpage{background:#fff;color:#222;width:calc(640px*var(--z,1));max-width:none;margin:0 auto;padding:calc(48px*var(--z,1));font-family:Georgia,'Times New Roman',serif;font-size:calc(13px*var(--z,1));line-height:1.6;box-shadow:0 6px 24px rgba(0,0,0,.3);min-height:calc(820px*var(--z,1));position:relative}
.pdfpage h4{color:#222;font-size:calc(16px*var(--z,1));text-align:center;margin-bottom:calc(10px*var(--z,1))}
.pdfpage .wm{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(60px*var(--z,1));color:rgba(28,125,157,.07);font-weight:700;transform:rotate(-24deg);pointer-events:none;font-family:var(--font)}
.sigpanel{background:var(--surface);border-left:1px solid var(--border);padding:20px;display:flex;flex-direction:column;gap:14px;overflow:auto}
.sigpad{border:2px dashed var(--border);border-radius:16px;background:#fff;touch-action:none;width:100%;height:190px;display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink-strong);color:var(--bg);padding:12px 20px;border-radius:14px;z-index:90;font-weight:600;max-width:92vw;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.lock{display:inline-flex;align-items:center;gap:6px;color:var(--success);font-weight:700}
.docs{display:grid;gap:14px;grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:900px){.docs{grid-template-columns:1fr}}
.docc{border:1px solid var(--border);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.docc.locked{border-color:var(--success);background:linear-gradient(0deg,var(--success-bg),var(--surface) 70%)}
.docc.corr{border-color:var(--warning)}
details summary{cursor:pointer;font-weight:600;font-size:13px;color:var(--primary)}
.tl{display:flex;flex-direction:column;gap:0}
.tl .it{display:grid;grid-template-columns:150px 1fr;gap:14px;padding:12px 0;border-bottom:1px solid var(--border);font-size:14px}
@media (max-width:700px){.tl .it{grid-template-columns:1fr}}
.demo-tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--accent);color:#3d2f00;padding:2px 8px;border-radius:6px}
</style>
</head>
<body>
<div id="topbar"></div>
<div id="view"></div>
<div id="modal"></div>
<div id="dialog"></div>
<div id="toast"></div>
<script>
'use strict';
/* =========================================================
   MCD Eventos — protótipo navegável (dados fictícios, sem backend)
   Nenhum e-mail, Drive, banco ou assinatura com validade jurídica é real.
   ========================================================= */
const BASE='2026-10-23';
const FE='FUNCIONARIO_EVENTO', INT='INTERMITENTE';
const GR={[FE]:{nome:'Funcionários do Evento',cls:'fe',icon:'👷',curto:'FE'},[INT]:{nome:'Intermitentes',cls:'int',icon:'🕒',curto:'INT'}};
const AREAS=['BAR','AMBULANTE','SERVIÇOS GERAIS','FINANCEIRO','ESCRITÓRIO','COZINHA','PRODUÇÃO','ESTOQUISTA','STAFF'];
const EVENTS=[
 {id:'EVT-001',nome:'Operação Maracanã — Evento A',data:'2026-10-25',inicio:'08:00',fim:'23:00',local:'Estádio do Maracanã, Rio de Janeiro/RJ',status:'Planejado',hue:196,sigla:'MARACANÃ'},
 {id:'EVT-002',nome:'Evento B — Demonstração',data:'2026-10-25',inicio:'10:00',fim:'21:00',local:'Rio de Janeiro/RJ — local fictício',status:'Planejado',hue:28,sigla:'EVENTO B'},
 {id:'EVT-003',nome:'Evento C — Convocação em andamento',data:'2026-10-30',inicio:'09:00',fim:'20:00',local:'Arena fictícia, Niterói/RJ',status:'Convocação aberta',hue:276,sigla:'EVENTO C'},
 {id:'EVT-OLD',nome:'Evento Arquivado — Demonstração',data:'2026-08-15',inicio:'09:00',fim:'18:00',local:'Local fictício',status:'Arquivado',hue:210,sigla:'ARQUIVO'}
];
const PERFIS={
 admin:{nome:'Administrador MCD',grupos:[FE,INT],convocar:1,assinar:1,reabrir:1,fechar:1,aprovar:1,exportar:1,excecao:1,pii:1},
 coordFE:{nome:'Coordenador — Funcionários do Evento',grupos:[FE],convocar:1,assinar:1,reabrir:1,fechar:1,exportar:1,excecao:1,pii:1},

/* --- Convocados --- */
function filtrar(list,key,fields){
  const f=S.filt[key]||{};
  return list.filter(p=>(!f.q||(p.codigo+' '+p.nome).toLowerCase().includes(f.q.toLowerCase()))&&fields.every(([k,fn])=>!f[k]||fn(p,f[k])));
}
function paginar(list,key,size=10){
  const pages=Math.max(1,Math.ceil(list.length/size));let pg=Math.min(S.pg[key]||0,pages-1);S.pg[key]=pg;
  return{items:list.slice(pg*size,pg*size+size),pg,pages,total:list.length,key};
}
const pager=o=>`<div class="pager"><span class="muted">${o.total} registro(s) · página ${o.pg+1} de ${o.pages}</span><button class="btn sm" data-act="page" data-k="${o.key}" data-d="-1" ${o.pg===0?'disabled':''}>‹ Anterior</button><button class="btn sm" data-act="page" data-k="${o.key}" data-d="1" ${o.pg>=o.pages-1?'disabled':''}>Próxima ›</button></div>`;
const fsel=(key,k,label,opts)=>`<label class="f">${label}<select data-in="filt" data-key="${key}" data-k="${k}"><option value="">Todos</option>${opts.map(([v,t])=>`<option value="${esc(v)}" ${(S.filt[key]||{})[k]===v?'selected':''}>${esc(t)}</option>`).join('')}</select></label>`;

function checklist(e,g){

   {ok:s.pend===0&&s.aptos>0,t:'Pacotes individuais conferidos e bloqueados',d:`${s.conferidos} de ${s.aptos} aptos conferidos${s.excecoes?` · ${s.excecoes} com exceção aprovada`:''}. Faltam ${s.pend}.`,a:s.pend?`<button class="btn sm" data-act="tab" data-t="documentos">Ver pendências</button>`:''},
   {ok:s.corr+reqs===0,t:'Sem correções ou reaberturas em aberto',d:`${s.corr} documento(s) em correção · ${reqs} solicitação(ões) aguardando autorização.`,a:(s.corr+reqs)?`<button class="btn sm" data-act="tab" data-t="documentos">Resolver</button>`:''},
   {ok:!!S.jornada[k],t:'Jornada e presença apuradas (A VALIDAR com o DP)',d:S.jornada[k]?'Marcada como apurada (simulação).':'Presença e jornada ainda não apuradas. A regra real de apuração será definida pelo DP.',a:S.jornada[k]?'':`<button class="btn sm" data-act="jornada" ${can('fechar')||can('aprovar')?'':'disabled'}>Marcar como apurada</button>`},
   {ok:!!S.aprov[k],t:'Conferência da contabilidade aprovada',d:S.aprov[k]?`Aprovada por ${esc(S.aprov[k].por)} em ${fmtTs(S.aprov[k].em)}.`:'Aguardando aprovação de perfil autorizado (Contabilidade ou Administrador).',a:S.aprov[k]?'':`<button class="btn sm" data-act="aprovar" ${can('aprovar')?'':'disabled title="Somente Contabilidade ou Administrador"'}>Aprovar conferência</button>`}
  ];
  return items;
}
function tFolha(e,g){
  const k=gkey(e.id,g),lotes=S.lotes[k]||[],atual=lotes[lotes.length-1],items=checklist(e,g),allok=items.every(i=>i.ok);

   <div class="row" style="margin-top:14px"><button class="btn primary" data-act="fechar" ${allok&&can('fechar')&&(aberto||ret)?'':'disabled'}>🔒 Fechar e bloquear lote${atual&&ret?' (nova versão)':''}</button>
   ${!can('fechar')?'<span class="small muted">Seu perfil não pode fechar o lote.</span>':!allok?'<span class="small muted">Complete o checklist para liberar.</span>':''}</div></div>
  ${atual?tLote(e,g,atual):`<div class="card empty"><div style="font-size:34px">📦</div><b>Nenhum lote fechado ainda</b><span class="small">Ao fechar, o lote de Funcionários do Evento ganha identificador, versão e manifesto.</span></div>`}
  ${lotes.length>1?`<div class="card flat"><h3>Lotes anteriores (imutáveis)</h3>${lotes.slice(0,-1).map(l=>`<div class="row between small" style="padding:8px 0;border-bottom:1px solid var(--border)"><span><b>${l.id}</b> · fechado em ${fmtTs(l.em)}</span>${chip('Substituído por v'+(l.versao+1),'')}</div>`).join('')}</div>`:''}`;

const dst=[['banco','Banco de dados e armazenamento de arquivos'],['drive','Google Drive (pasta ano/evento/grupo/versão)'],['contab','Disponível para a contabilidade']];

    ${txt.map(([a,t])=>`<p style="margin-bottom:12px"><b>${a}.</b> ${t}</p>`).join('')}${txt.map(([a,t])=>`<p style="margin-bottom:12px"><b>${+a+4}.</b> ${t}</p>`).join('')}
    <div style="margin-top:36px;border-top:1px solid #999;width:60%;padding-top:6px;font-size:.9em">${locked&&ativa?`✔ Assinado em ${fmtTs(ativa.em)} · v${ativa.v}`:'Assinatura do trabalhador'}</div></article></div>
   <aside class="sigpanel">${locked?`<div class="notice ok"><b>🔒 Documento assinado e bloqueado.</b><br>Versão ${ativa.v} · ${fmtTs(ativa.em)}<br>Operador: ${esc(ativa.por)}</div><p class="small muted">Para corrigir, use “Reabrir” na ficha. A versão atual será preservada no histórico.</p>`:
    `<h3>Assinatura</h3><div class="notice warn small"><b>Demonstração:</b> esta assinatura desenhada não tem validade jurídica.</div>
     <p class="small muted">1. Leia o documento ao lado. 2. Peça ao trabalhador para assinar com o dedo ou a caneta. 3. Confirme.</p>
     <canvas id="sig" class="sigpad" width="700" height="380" aria-label="Área de assinatura"></canvas>
     <div id="sigerr" class="notice bad small" hidden></div>
     <div class="row"><button class="btn sm" data-act="sigclear">Limpar</button><button class="btn primary grow" id="sigok" data-act="sigconfirm" disabled>Confirmar assinatura</button></div>
     <p class="tiny muted">Depois de confirmar, o documento fica bloqueado para edição.</p>`}</aside></div></div>`;
  if(!locked)initSig();
}
function initSig(){
  const c=$('#sig');if(!c)return;const x=c.getContext('2d');x.lineWidth=4;x.lineCap='round';x.strokeStyle='#1b2b33';let down=false;
  const pos=ev=>{const r=c.getBoundingClientRect();return[(ev.clientX-r.left)*c.width/r.width,(ev.clientY-r.top)*c.height/r.height]};
  c.addEventListener('pointerdown',ev=>{down=true;c.setPointerCapture(ev.pointerId);const[a,b]=pos(ev);x.beginPath();x.moveTo(a,b)});
  c.addEventListener('pointermove',ev=>{if(!down)return;const[a,b]=pos(ev);x.lineTo(a,b);x.stroke();if(!V.drawn){V.drawn=true;$('#sigok').disabled=false}});
  const up=()=>{down=false};c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);
}
function sigConfirm(){
  const p=person(V.id),d=p.docs[V.n-1];
  if(!V.drawn)return;
  if(S.offline){const el=$('#sigerr');el.hidden=false;el.textContent='Sem conexão: a assinatura NÃO foi confirmada. O desenho foi mantido nesta tela; tente novamente quando voltar a conexão.';return}
  confirmDlg('Confirmar assinatura?',`Após confirmar, o <b>${d.nome}</b> de <b>${esc(p.nome)}</b> será bloqueado para edição. Esta é uma assinatura de demonstração.`,'Confirmar e bloquear',()=>{
    if(d.status==='BLOQUEADO')return;
    const v=d.versoes[d.versoes.length-1];v.estado='ATIVA';v.em=nowSim().replace(' ','T');v.por=PERFIS[S.perfil].nome;d.status='BLOQUEADO';
    log(p.grupo,p.evt,'CONFIRMOU_ASSINATURA',`DOC-${d.n} / ${p.id}`,'');
    toast(`${d.nome} assinado e bloqueado (${done(p)}/3)`);
    openViewer(p.id,d.n);render();
  });
}
/* ---------- ações ---------- */
const ACT={
 go(el){go(JSON.parse(el.dataset.r))},
 nodata(el){toast('Sem eventos em '+dBR(el.dataset.d))},
 mes(el){let[y,m]=S.mes.split('-').map(Number);m+=+el.dataset.d;if(m<1){m=12;y--}if(m>12){m=1;y++}S.mes=`${y}-${String(m).padStart(2,'0')}`;render()},
 dismiss(el){S.dismissed.push(el.dataset.id);render()},
 restore(){S.dismissed=[];render()},
 offline(){S.offline=!S.offline;toast(S.offline?'Modo sem conexão (simulado)':'Conexão restabelecida');const vo=$('#vo');if(vo)vo.textContent=S.offline?'Voltar online':'Simular sem conexão';render()},
 logout(){S.route={screen:'login'};render()},
 recover(){dialog({title:'Recuperar acesso',body:'<p class="muted">Demonstração: nenhum e-mail é enviado de verdade.</p><label class="f">Usuário ou e-mail<input type="text" id="rc"></label>',actions:[{label:'Cancelar',fn:closeDlg},{label:'Simular envio',cls:'primary',fn:()=>{closeDlg();toast('Simulação: nenhum e-mail foi enviado')}}]})},
 enter(el){const g=el.dataset.g;go({screen:'mod',evt:S.route.evt,grupo:g,tab:'resumo'})},
 tab(el){const r=S.route;go({screen:'mod',evt:r.evt,grupo:r.grupo,tab:el.dataset.t})},
 area(el){const r=S.route;go({screen:'mod',evt:r.evt,grupo:r.grupo,tab:'areas',area:el.dataset.a})},
 lider(el){const r=S.route;go({screen:'mod',evt:r.evt,grupo:r.grupo,tab:'areas',area:r.area,lider:el.dataset.id})},
 pessoa(el){const r=S.route,p=person(el.dataset.id);go({screen:'mod',evt:r.evt,grupo:r.grupo,tab:r.tab,area:r.tab==='areas'?p.area:undefined,lider:r.tab==='areas'?p.lider:undefined,pid:p.id})},
 page(el){S.pg[el.dataset.k]=(S.pg[el.dataset.k]||0)+ +el.dataset.d;render()},
 reveal(el){S.reveal[el.dataset.id]=1;log(S.route.grupo,S.route.evt,'VISUALIZOU_DADOS_RESTRITOS',el.dataset.id,'');render()},
 download(){toast('Download simulado: nenhum arquivo foi gerado')},
 'arq-view'(el){const e=evt(el.dataset.id);dialog({title:e.nome,wide:1,body:`<div class="notice info small">Evento arquivado há ${diffDias(BASE,e.data)} dias. Somente leitura.</div><div class="grid g2"><div class="card flat"><h4>${GR[FE].nome}</h4><p class="small muted">Lote v1 preservado · PDFs e histórico mantidos.</p></div><div class="card flat"><h4>${GR[INT].nome}</h4><p class="small muted">Lote próprio preservado · PDFs e histórico mantidos.</p></div></div><p class="small muted">Os grupos continuam separados também no arquivo. Nenhum documento é excluído automaticamente.</p>`,actions:[{label:'Fechar',cls:'primary',fn:closeDlg}]})},
 invite(){
  const r=S.route,e=evt(r.evt),g=r.grupo,ls=LEADERS.filter(l=>l.evt===e.id&&l.grupo===g);
  const livres=MESTRE.filter(m=>!PEOPLE.some(p=>p.evt===e.id&&p.grupo===g&&p.codigo===m.codigo));
  dialog({title:'Nova convocação — '+GR[g].nome,wide:1,body:`<div class="notice ${GR[g].cls==='fe'?'info':'int'} small">Evento: <b>${esc(e.nome)}</b> · Grupo: <b>${GR[g].nome}</b> (fixos). O envio é simulado.</div>
   <label class="f">Pessoa (cadastro mestre)<select id="iv-p">${livres.map(m=>`<option value="${m.codigo}">${m.codigo} — ${esc(m.nome)}</option>`).join('')}</select></label>
   <div class="grid g2"><label class="f">Área<select id="iv-a">${AREAS.map(a=>`<option>${a}</option>`).join('')}</select></label><label class="f">Liderança<select id="iv-l">${ls.map(l=>`<option value="${l.id}">${l.codigo} — ${esc(l.nome)}</option>`).join('')}</select></label>
   <label class="f">Função<input type="text" id="iv-f" value="Equipe operacional"></label><label class="f">Turno<input type="text" id="iv-t" value="08:00–18:00"></label></div>
   <label class="f">Canal<select id="iv-c"><option value="EMAIL">E-mail (simulado)</option><option value="PORTAL">Aplicativo / portal (simulado)</option></select></label>`,
   actions:[{label:'Cancelar',fn:closeDlg},{label:'Simular envio',cls:'primary',fn:()=>{
    const cod=$('#iv-p').value,lid=$('#iv-l').value;if(!cod||!lid){toast('Escolha a pessoa e a liderança');return}
    const outro=PEOPLE.find(p=>p.evt===e.id&&p.grupo!==g&&p.codigo===cod);
    const fazer=()=>{const m=MESTRE.find(x=>x.codigo===cod);addPerson({evt:e.id,grupo:g,codigo:cod,nome:m.nome,area:$('#iv-a')?$('#iv-a').value:'BAR',lider:lid,conv:'NAO_RESPONDEU',form:'NAO_INICIADO',canal:$('#iv-c')?$('#iv-c').value:'EMAIL',funcao:'Equipe operacional'});log(g,e.id,'CONVOCOU',cod,'');closeDlg();toast('Convite simulado: '+m.nome+' agora está como “Não respondeu”');render()};
    const area=$('#iv-a').value;if(outro){dialog({title:'Possível conflito entre grupos',body:`<div class="notice warn"><b>${esc(outro.nome)}</b> já participa deste evento no grupo <b>${GR[outro.grupo].nome}</b>. Nenhuma migração é feita automaticamente: a decisão é administrativa.</div>`,actions:[{label:'Cancelar',fn:closeDlg},{label:'Registrar mesmo assim',cls:'primary',fn:()=>{const v=area;const m=MESTRE.find(x=>x.codigo===cod);addPerson({evt:e.id,grupo:g,codigo:cod,nome:m.nome,area:v,lider:lid,conv:'NAO_RESPONDEU',form:'NAO_INICIADO'});log(g,e.id,'CONVOCOU_COM_ALERTA_DE_CONFLITO',cod,'Decisão administrativa');closeDlg();toast('Convite simulado, com alerta de conflito registrado');render()}}]});return}
    fazer();}}]});
 },
 portal(el){
  const p=person(el.dataset.id),e=evt(p.evt);
  if(p.conv==='CONFIRMADO'){return ACT.form(el)}
  dialog({title:'Portal do trabalhador — convite',wide:1,body:`<div class="notice info small">Simulação da resposta do trabalhador (portal/e-mail). Nada é enviado.</div><div class="card flat"><div class="eyebrow">${GR[p.grupo].nome}</div><h3>${esc(e.nome)}</h3><p class="small muted">📍 ${esc(e.local)} · 📅 ${dBR(e.data)} · 🕗 ${p.turno}<br>Função: ${p.funcao} · Área: ${p.area}</p></div><p>Olá, <b>${esc(p.nome)}</b>. Você confirma sua participação?</p>`,
   actions:[{label:'Não confirmar',cls:'danger',fn:()=>{p.conv='NAO_CONFIRMADO';p.form='NAO_INICIADO';log(p.grupo,p.evt,'RESPOSTA_CONVITE',p.id,'Não confirmado');closeDlg();toast('Resposta registrada: Não confirmado. Segue visível em Convocados, fora da operação.');render()}},
            {label:'Confirmar participação',cls:'primary',fn:()=>{p.conv='CONFIRMADO';p.form='PENDENTE';log(p.grupo,p.evt,'RESPOSTA_CONVITE',p.id,'Confirmado');closeDlg();toast('Confirmado. O formulário ficou pendente: ainda não está apto.');render()}}]});
 },
 form(el){
  const p=person(el.dataset.id);
  dialog({title:'Formulário de cadastro',wide:1,body:`<div class="notice info small">Concluir o formulário não gera assinatura nem presença. Campos de demonstração (a lista real será definida com o DP).</div>
   <div class="grid g2"><label class="f">Nome completo<input type="text" value="${esc(p.nome)}"></label><label class="f">Telefone<input type="text" value="(21) 90000-0000"></label><label class="f">E-mail<input type="text" value="${p.codigo}@exemplo.invalid"></label><label class="f">Endereço<input type="text" value="Rua de Demonstração, s/n"></label></div>
   <label class="row" style="gap:8px"><input type="checkbox" id="fm-ok"> Confirmo que os dados acima estão corretos (consentimentos a validar)</label>`,
   actions:[{label:'Fechar',fn:closeDlg},{label:'Concluir formulário',cls:'primary',fn:()=>{if(!$('#fm-ok').checked){toast('Marque a confirmação para concluir');return}p.form='CONCLUIDO';log(p.grupo,p.evt,'CONCLUIU_FORMULARIO',p.id,'');closeDlg();toast(p.nome+' agora está apto e entra na lista operacional');render()}}]});
 },
 viewer(el){openViewer(el.dataset.id,+el.dataset.n)},
 closeviewer(){$('#modal').innerHTML='';render()},
 zoom(el){V.z=Math.max(.6,Math.min(1.8,V.z+ +el.dataset.d));$('#pdfpage').style.setProperty('--z',V.z)},
 sigclear(){const c=$('#sig');c.getContext('2d').clearRect(0,0,c.width,c.height);V.drawn=false;$('#sigok').disabled=true},
 sigconfirm(){sigConfirm()},
 conferir(el){const p=person(el.dataset.id);confirmDlg('Conferir e bloquear o pacote?',`O pacote individual de <b>${esc(p.nome)}</b> (3/3) será conferido e bloqueado. Isso não fecha o lote do evento.`,'Conferir e bloquear',()=>{p.conferido=true;log(p.grupo,p.evt,'CONFERIU_PACOTE','PACOTE / '+p.id,'');toast('Pacote conferido e bloqueado');render()})},
 reopen(el){
  const p=person(el.dataset.id),n=+el.dataset.n,d=p.docs[n-1],auth=can('reabrir');
  dialog({title:(auth?'Reabrir ':'Solicitar correção do ')+d.nome,body:`<div class="notice warn small">A versão atual será <b>preservada</b> no histórico e uma nova versão será criada para nova assinatura. Nada é apagado.${auth?'':' Sua solicitação precisa ser aprovada por perfil autorizado.'}</div><label class="f">Motivo (obrigatório)<textarea id="rp-m" placeholder="Explique o motivo da correção"></textarea></label><div id="rp-e" class="notice bad small" hidden>Informe um motivo com pelo menos 10 caracteres.</div>`,
   actions:[{label:'Cancelar',fn:closeDlg},{label:auth?'Reabrir documento':'Enviar solicitação',cls:'primary',fn:()=>{const m=$('#rp-m').value.trim();if(m.length<10){$('#rp-e').hidden=false;return}
    if(auth){reabrir(p,n,m);}else{S.reqs.push({id:'R'+S.seq++,pid:p.id,n,motivo:m,por:PERFIS[S.perfil].nome,status:'PENDENTE',evt:p.evt,grupo:p.grupo});log(p.grupo,p.evt,'SOLICITOU_REABERTURA',`DOC-${n} / ${p.id}`,m);toast('Solicitação enviada para aprovação')}
    closeDlg();render()}}]});
 },
 'aprovar-req'(el){const r=S.reqs.find(x=>x.id===el.dataset.id);const p=person(r.pid);r.status='APROVADA';reabrir(p,r.n,r.motivo,true);render()},
 excecao(el){const p=person(el.dataset.id);dialog({title:'Aprovar exceção',body:`<p><b>${esc(p.nome)}</b> poderá ficar fora do fechamento mesmo sem pacote conferido.</p><label class="f">Tipo e motivo<select id="ex-t"><option>Ausência justificada</option><option>Substituição</option><option>Documento dispensado (A VALIDAR)</option></select></label><label class="f">Detalhe (obrigatório)<textarea id="ex-m"></textarea></label><div id="ex-e" class="notice bad small" hidden>Descreva o motivo da exceção.</div>`,actions:[{label:'Cancelar',fn:closeDlg},{label:'Aprovar exceção',cls:'primary',fn:()=>{const m=$('#ex-m').value.trim();if(m.length<5){$('#ex-e').hidden=false;return}p.excecao=$('#ex-t').value+': '+m;log(p.grupo,p.evt,'APROVOU_EXCECAO',p.id,p.excecao);closeDlg();toast('Exceção aprovada e registrada');render()}}]})},
 'demo-sign'(){const r=S.route;let n=0;aptos(r.evt,r.grupo).forEach(p=>{if(p.excecao)return;p.docs.forEach(d=>{if(d.status!=='BLOQUEADO'){const v=d.versoes[d.versoes.length-1];v.estado='ATIVA';v.em=nowSim().replace(' ','T');v.por='Atalho de demonstração';d.status='BLOQUEADO'}});if(!p.conferido){p.conferido=true;n++}});log(r.grupo,r.evt,'ATALHO_DEMO_CONCLUIR_PENDENCIAS','Todos os aptos','Somente protótipo');toast('Atalho de demonstração: '+n+' pacotes concluídos (não existe na solução real)');render()},
 jornada(){const k=gkey(S.route.evt,S.route.grupo);S.jornada[k]=1;log(S.route.grupo,S.route.evt,'MARCOU_JORNADA_APURADA','Evento','Simulação');render()},
 aprovar(){const k=gkey(S.route.evt,S.route.grupo);S.aprov[k]={por:PERFIS[S.perfil].nome,em:nowSim()};log(S.route.grupo,S.route.evt,'APROVOU_CONFERENCIA','Evento','');render()},
 fechar(){
  const r=S.route,e=evt(r.evt),g=r.grupo,k=gkey(e.id,g),s=stats(e.id,g);
  confirmDlg('Fechar e bloquear o lote?',`O lote de <b>${GR[g].nome}</b> do evento <b>${esc(e.nome)}</b> será bloqueado e preparado para entrega. O lote do outro grupo <b>não</b> é afetado.`,'Fechar e bloquear',()=>{
    const arr=S.lotes[k]=S.lotes[k]||[];const v=arr.length+1;if(arr.length)arr[arr.length-1].estado='SUBSTITUIDO';
    arr.push({id:`LOTE-${e.id}-${GR[g].curto}-v${v}`,versao:v,grupo:g,em:nowSim().replace(' ','T'),por:PERFIS[S.perfil].nome,pessoas:s.aptos-s.excecoes,docs:(s.aptos-s.excecoes)*3,excecoes:s.excecoes,estado:'FECHADO',retificacao:false,ent:{banco:'AGUARDANDO',drive:'AGUARDANDO',contab:'AGUARDANDO'},entEm:{}});
    S.jornada[k]=S.jornada[k];log(g,e.id,'FECHOU_LOTE','LOTE v'+v,'');toast('Lote v'+v+' fechado e bloqueado');render()});
 },
 enviar(el){envio(el.dataset.m)}
};
function reabrir(p,n,motivo,viaReq){
  const d=p.docs[n-1];d.status='EM_CORRECAO';const cur=d.versoes.find(x=>x.estado==='ATIVA');if(cur)cur.estado='SUBSTITUIDA';
  d.versoes.push({v:d.versoes.length+1,estado:'AGUARDANDO',em:null,por:null});p.conferido=false;
  const k=gkey(p.evt,p.grupo);delete S.aprov[k];const l=loteAtual(p.evt,p.grupo);if(l&&(l.estado==='FECHADO'||l.estado==='EXPORTADO'))l.retificacao=true;
  log(p.grupo,p.evt,viaReq?'APROVOU_REABERTURA':'REABRIU_DOCUMENTO',`DOC-${n} / ${p.id}`,motivo+' (v'+(d.versoes.length-1)+' preservada)');
  toast('Documento reaberto: v'+(d.versoes.length-1)+' preservada, nova versão criada'+(l?'. O lote já fechado exige retificação.':''));
}
function envio(modo){
  const r=S.route,l=loteAtual(r.evt,r.grupo);if(!l)return;
  S.fail=modo==='falha';
  const ordem=['banco','drive','contab'];
  const passo=()=>{
    const prox=ordem.find(k=>l.ent[k]!=='ENTREGUE');if(!prox){render();return}
    l.ent[prox]='PROCESSANDO';render();
    setTimeout(()=>{
      if(S.offline||(S.fail&&prox==='drive')){l.ent[prox]='ERRO';l.erro=S.offline?'Sem conexão. O lote continua guardado; tente novamente.':'Falha simulada ao enviar ao Google Drive. O lote continua guardado; tente novamente.';S.fail=false;render();return}
      l.ent[prox]='ENTREGUE';l.entEm[prox]=nowSim().replace(' ','T');l.erro='';
      if(prox==='contab'){l.estado='EXPORTADO';log(r.grupo,r.evt,'ENTREGA_SIMULADA_CONCLUIDA',l.id,'')}
      render();passo();
    },900);
  };
  ordem.forEach(k=>{if(l.ent[k]==='ERRO')l.ent[k]='AGUARDANDO'});
  passo();
}
/* ---------- eventos ---------- */
document.addEventListener('click',ev=>{
  const dl=ev.target.closest('[data-dlg]');if(dl){const f=DLG.fns[+dl.dataset.dlg];f&&f();return}
  if(ev.target.closest('[data-stop]')&&!ev.target.closest('button'))return;
  const el=ev.target.closest('[data-act]');if(!el)return;
  if(el.closest('[data-stop]')&&el.tagName==='TR')return;
  const f=ACT[el.dataset.act];if(f){ev.stopPropagation();f(el)}
});
document.addEventListener('input',ev=>{
  const el=ev.target;if(!el.dataset)return;
  if(el.dataset.in==='filt'){const f=S.filt[el.dataset.key]=S.filt[el.dataset.key]||{};f[el.dataset.k]=el.value;S.pg[el.dataset.key]=0;render()}
});
document.addEventListener('change',ev=>{
  const el=ev.target;if(!el.dataset)return;
  if(el.dataset.in==='perfil'){S.perfil=el.value;toast('Perfil: '+PERFIS[S.perfil].nome);const r=S.route;if(r.screen==='mod'&&!PERFIS[S.perfil].grupos.includes(r.grupo)){render();return}if(S.perfil==='lider'&&r.screen==='mod'&&r.tab==='areas'&&r.lider&&r.lider!=='L0801'){go({screen:'mod',evt:r.evt,grupo:r.grupo,tab:'areas'});return}render()}
  if(el.dataset.in==='showaudit'){S.showAudit=el.checked;render()}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){if($('#dialog').innerHTML)closeDlg()}});
render();
